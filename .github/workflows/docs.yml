name: Documentation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Markdown, citations, and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Validate source maps and local links
        run: python3 scripts/check_docs.py

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'

      - name: Check external links
        # Some upstream hosts rate-limit or deny CI bot requests. Accepted 403/429
        # statuses indicate a response, not verification of page content.
        uses: lycheeverse/lychee-action@7da8ec1fc4e01b5a12062ac6c589c10a4ce70d67 # v2.0.0
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            --max-retries 2
            --timeout 20
            --accept 200,204,206,301,302,403,429
            './**/*.md'
